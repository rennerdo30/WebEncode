name: Bug Report
description: Report a reproducible problem in WebEncode.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please include enough detail for us to reproduce it quickly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is happening and what did you expect instead?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide exact steps and inputs.
      placeholder: |
        1. Go to ...
        2. Start ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs, stack traces, screenshots, or recordings.
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Kernel/API
        - Worker
        - Plugin system
        - Frontend UI
        - Deployment/DevOps
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Tag, commit SHA, or branch where this happens.
      placeholder: main (abc1234)

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Docker/Go/Node versions, and any relevant config.
      placeholder: |
        - OS:
        - Go:
        - Node:
        - Docker:
